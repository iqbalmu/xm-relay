[package]
name = "xmrelay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Local-first, cross-agent CLI tool for verifiable AI coding session handoffs"

[[bin]]
name = "xmrelay"
path = "src/main.rs"

[dependencies]
xmrelay-core.workspace = true
xmrelay-adapter-opencode.workspace = true
xmrelay-adapter-omp.workspace = true
xmrelay-repository.workspace = true
xmrelay-security.workspace = true
xmrelay-checkpoint.workspace = true
xmrelay-handoff.workspace = true
xmrelay-adapter-antigravity.workspace = true
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
unicode-width = "0.2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tar = "0.4"
flate2 = "1"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"
