[package]
name = "xm-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Local-first, cross-agent CLI tool for verifiable AI coding session handoffs"

[dependencies]
xm-relay-core.workspace = true
xm-relay-adapter-opencode.workspace = true
xm-relay-adapter-omp.workspace = true
xm-relay-repository.workspace = true
xm-relay-security.workspace = true
xm-relay-checkpoint.workspace = true
xm-relay-handoff.workspace = true
xm-relay-adapter-antigravity.workspace = true
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"
