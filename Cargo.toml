[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/adapters/opencode", "crates/adapters/omp", "crates/adapters/antigravity", "crates/repository", "crates/security", "crates/checkpoint", "crates/handoff", "crates/tui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
xm-relay-core = { path = "crates/core" }
xm-relay-adapter-opencode = { path = "crates/adapters/opencode" }
xm-relay-adapter-omp = { path = "crates/adapters/omp" }
xm-relay-adapter-antigravity = { path = "crates/adapters/antigravity" }
xm-relay-repository = { path = "crates/repository" }
xm-relay-security = { path = "crates/security" }
xm-relay-checkpoint = { path = "crates/checkpoint" }
xm-relay-handoff = { path = "crates/handoff" }
xm-relay-tui = { path = "crates/tui" }
