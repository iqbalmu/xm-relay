[workspace]
resolver = "2"
default-members = ["crates/cli"]
members = ["crates/core", "crates/cli", "crates/adapters/opencode", "crates/adapters/omp", "crates/adapters/antigravity", "crates/repository", "crates/security", "crates/checkpoint", "crates/handoff"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/iqbalmu/xmrelay"
homepage = "https://github.com/iqbalmu/xmrelay"

[workspace.dependencies]
xmrelay-core = { path = "crates/core" }
xmrelay-adapter-opencode = { path = "crates/adapters/opencode" }
xmrelay-adapter-omp = { path = "crates/adapters/omp" }
xmrelay-adapter-antigravity = { path = "crates/adapters/antigravity" }
xmrelay-repository = { path = "crates/repository" }
xmrelay-security = { path = "crates/security" }
xmrelay-checkpoint = { path = "crates/checkpoint" }
xmrelay-handoff = { path = "crates/handoff" }
